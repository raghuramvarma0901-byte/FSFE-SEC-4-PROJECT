<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
        }

        .login {
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            background-color: white;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 30px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login">
        <h2>Login Here</h2>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button>Login</button>
    </div>
</body>
</html>
